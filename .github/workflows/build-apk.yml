name: Build Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (ubuntu-latest ships SDK 34 + build-tools 34.0.0)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | head -40 || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Keystore: prefer committed keystore file (open-source reference build).
      # If CI env vars are set, those take precedence (see keystore/README.md).
      - name: Verify keystore present
        run: |
          if [ -f keystore/islamichub-release.keystore ]; then
            echo "✓ Committed keystore found"
            ls -la keystore/
          else
            echo "No committed keystore — build will fall back to debug signing"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK"
          ls -la "$APK"
          # Output signing info
          echo "=== APK signing info ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-cert "$APK" 2>&1 | head -20 || true

      - name: Rename APK for release
        id: rename
        run: |
          SRC="${{ steps.apk.outputs.path }}"
          DST="app/build/outputs/apk/release/islamichub-release.apk"
          cp "$SRC" "$DST"
          echo "renamed=$DST" >> $GITHUB_OUTPUT

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum islamichub-release.apk > checksums.txt
          cat checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: islamichub-release-apk
          path: |
            app/build/outputs/apk/release/islamichub-release.apk
            app/build/outputs/apk/release/checksums.txt
          retention-days: 90

      - name: Create GitHub release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Islamic Hub ${{ github.ref_name }}
          body: |
            # Islamic Hub ${{ github.ref_name }}

            Bangla-first native Android (Kotlin + Jetpack Compose) app.
            Signed with the project release keystore.

            ## Install
            - Download `islamichub-release.apk` below
            - Tap to install (allow "Install from unknown sources" if prompted)

            ## What's new (${{ github.ref_name }})
            - 🔤 **বাংলা উচ্চারণ (Bangla transliteration) for the whole Quran** — all 6,236 ayahs bundled offline, shown under each Arabic ayah in the reader, tafsir & thematic study (toggle in Settings)
            - 🔠 **Text size controls on every page** — independent আরবি / বাংলা / English sliders (70%–180%) with live preview, applied across 18 reading screens
            - 🐛 **Thematic Quran fix** — tapping the expanded tafsir no longer collapses it; শোনো / সংরক্ষণ / শেয়ার chips are now fully functional (play with selected reciter, real bookmark, share)
            - 🎨 **Quran AI button redesigned** — labeled gradient "AI তাফসীর" pill + "শব্দে শব্দ" chip per ayah
            - ✨ **Premium tafsir screen** — gradient ayah hero, premium section headers, per-script font scaling

            ## Features (cumulative)
            - **Al-Quran**: 114 surahs, 6236 ayahs, full Arabic + Bengali + English (offline bundle + AlQuran.cloud)
            - **Hadith**: 24,424 hadiths across Bukhari, Muslim, Tirmidhi, Abu Dawud + 32 thematic topics
            - **Prayer Times**: Aladhan API + FusedLocation with notification alarms & next-prayer progress
            - **Qibla**: spring-physics compass pointing to Kaaba
            - **Trackers**: Qada dashboard, fasting dashboard with period history, daily tracker, Quran khatam with permanent history
            - **Tasbih, 99 Names, Duas, Kalima, Stories, Q&A, Quiz, Zakat calculator**
            - **Topic Study**: 45 topics via keyword-scoring engine over the offline Quran
            - **Tafsir**: 4 sources, online + offline cache; word-by-word; 12 reciters
            - **AI Scholar, Tajweed checker, Scanner, Namaz shikkha with audio**
            - **Premium motion system**: staggered entrances, count-ups, pulse highlights, glows
            - **Material 3 + dark/light theme + Bangla-first UI**
          files: |
            app/build/outputs/apk/release/islamichub-release.apk
            app/build/outputs/apk/release/checksums.txt
          draft: false
          prerelease: false
