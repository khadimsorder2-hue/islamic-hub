name: Build Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (ubuntu-latest ships SDK 34 + build-tools 34.0.0)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | head -40 || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK"
          ls -la "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: islamichub-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create GitHub release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Islamic Hub ${{ github.ref_name }}
          body: |
            # Islamic Hub ${{ github.ref_name }}

            Bangla-first native Android (Kotlin + Jetpack Compose) reference build.

            ## Install
            - Download `app-release.apk` below
            - Tap to install (allow "Install from unknown sources" if prompted)

            ## Features
            - Al-Quran reader (10 full surahs + all 114 metadata)
            - Prayer Times (Aladhan API + location)
            - Qibla compass
            - Tasbih counter
            - 99 Names of Allah (Asma ul Husna)
            - Daily Duas
            - Hijri Calendar
            - Material 3 + dark/light theme
            - Bengali + English UI
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
