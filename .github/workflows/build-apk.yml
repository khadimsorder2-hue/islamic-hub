name: Build Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (ubuntu-latest ships SDK 34 + build-tools 34.0.0)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | head -40 || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Keystore: prefer committed keystore file (open-source reference build).
      # If CI env vars are set, those take precedence (see keystore/README.md).
      - name: Verify keystore present
        run: |
          if [ -f keystore/islamichub-release.keystore ]; then
            echo "✓ Committed keystore found"
            ls -la keystore/
          else
            echo "No committed keystore — build will fall back to debug signing"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK"
          ls -la "$APK"
          # Output signing info
          echo "=== APK signing info ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-cert "$APK" 2>&1 | head -20 || true

      - name: Rename APK for release
        id: rename
        run: |
          SRC="${{ steps.apk.outputs.path }}"
          DST="app/build/outputs/apk/release/islamichub-release.apk"
          cp "$SRC" "$DST"
          echo "renamed=$DST" >> $GITHUB_OUTPUT

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum islamichub-release.apk > checksums.txt
          cat checksums.txt

      - name: Extract release notes from CHANGELOG.md
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          echo "Extracting release notes for tag: $TAG"
          # Extract the section between "## [vX.Y.Z]" and the next "## [" heading.
          # The heading line itself is dropped (we want only the body).
          # Also drop any trailing "---" horizontal rule lines and blank lines.
          # If the tag is not found in CHANGELOG.md, fall back to a generic message.
          NOTES=$(sed -n "/^## \\[${TAG}\\] /,/^## \\[/p" CHANGELOG.md \
                  | sed '1d' \
                  | sed '/^## \[/,$d' \
                  | sed -e :a -e '/^\n*$/{$d;N;ba}' \
                  | awk '{ lines[NR]=$0 } END {
                      # Walk back from end, dropping trailing "---" and blank lines
                      last=NR
                      while (last>0 && (lines[last]=="---" || lines[last]=="")) last--
                      for (i=1; i<=last; i++) print lines[i]
                    }')
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}. See https://github.com/${{ github.repository }}/commits for details."
          fi
          # Write to a file to preserve newlines and special characters.
          printf '%s\n' "$NOTES" > /tmp/release_notes.md
          echo "Saved release notes:"
          cat /tmp/release_notes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: islamichub-release-apk
          path: |
            app/build/outputs/apk/release/islamichub-release.apk
            app/build/outputs/apk/release/checksums.txt
          retention-days: 90

      - name: Create GitHub release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Islamic Hub ${{ github.ref_name }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/islamichub-release.apk
            app/build/outputs/apk/release/checksums.txt
