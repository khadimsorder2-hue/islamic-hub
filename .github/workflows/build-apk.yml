name: Build Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (ubuntu-latest ships SDK 34 + build-tools 34.0.0)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | head -40 || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Keystore: prefer committed keystore file (open-source reference build).
      # If CI env vars are set, those take precedence (see keystore/README.md).
      - name: Verify keystore present
        run: |
          if [ -f keystore/islamichub-release.keystore ]; then
            echo "✓ Committed keystore found"
            ls -la keystore/
          else
            echo "No committed keystore — build will fall back to debug signing"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK"
          ls -la "$APK"
          # Output signing info
          echo "=== APK signing info ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-cert "$APK" 2>&1 | head -20 || true

      - name: Rename APK for release
        id: rename
        run: |
          SRC="${{ steps.apk.outputs.path }}"
          DST="app/build/outputs/apk/release/islamichub-release.apk"
          cp "$SRC" "$DST"
          echo "renamed=$DST" >> $GITHUB_OUTPUT

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum islamichub-release.apk > checksums.txt
          cat checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: islamichub-release-apk
          path: |
            app/build/outputs/apk/release/islamichub-release.apk
            app/build/outputs/apk/release/checksums.txt
          retention-days: 90

      - name: Create GitHub release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Islamic Hub ${{ github.ref_name }}
          body: |
            # Islamic Hub ${{ github.ref_name }}

            Bangla-first native Android (Kotlin + Jetpack Compose) reference build.
            Signed with custom release keystore (committed to repo for open-source reference).

            ## Install
            - Download `islamichub-release.apk` below
            - Tap to install (allow "Install from unknown sources" if prompted)

            ## What's new (v1.2.0)
            - ✅ **Hadith collections**: 24,424 hadiths across Bukhari, Muslim, Tirmidhi, Abu Dawud (Arabic + Bangla)
            - ✅ **Hadith search** (cross-collection, Bangla + Arabic)
            - ✅ **Qada tracker** — add missed prayers, mark completed, persistent
            - ✅ **Daily tracker** — prayer checkbox with streak, zikr/ayahs/hadiths read stats
            - ✅ **Profile screen** — user name, stats, khatam progress, share progress
            - ✅ **Quran bookmarks** — bookmark any ayah, list view
            - ✅ **Quran Khatam tracker** — progress through 114 surahs, share khatam
            - ✅ **Settings screen** — font size, background mode, Arabic/Bangla/English toggles
            - ✅ **Qari selector** — 12 reciters with rounded profile avatars
            - ✅ **Tafsir** — online + offline cache, 4 sources (Bangla Mukhtasar, Taisirul, English Jalalayn, Ibn Kathir)
            - ✅ **Audio auto-pause timer** (5/15/30/60 min)
            - ✅ **Bangla meaning audio toggle**
            - ✅ **Word-by-word audio toggle**
            - ✅ **Khatam player** — continuous surah-by-surah playback
            - ✅ **Share features** — share ayah, share hadith, share khatam progress
            - ✅ **Last Read** — quick resume from last ayah
            - ✅ **Cache clear** — Settings option
            - ✅ **More screen** — central hub for all features
            - ✅ **Race-condition-free** architecture (single-writer repositories, idempotent operations)

            ## Features (cumulative)
            - **Al-Quran**: 114 surahs, 6236 ayahs, full Arabic + Bengali + English (AlQuran.cloud)
            - **Hadith**: 24,424 hadiths across 4 collections (Bukhari, Muslim, Tirmidhi, Abu Dawud)
            - **Prayer Times**: Aladhan API + FusedLocation with notification alarms
            - **Qibla**: rotation-vector compass pointing to Kaaba
            - **Tasbih**: tap counter with 5 dhikr presets
            - **99 Names of Allah** (Asma ul Husna)
            - **8 Daily Duas** (Arabic + Bengali + English)
            - **Hijri Calendar**
            - **Audio tilawat**: 12 reciters with khatam player, auto-pause, Bangla meaning audio
            - **Tafsir**: 4 sources, online + offline cache
            - **Trackers**: Qada, daily prayer, zikr, khatam
            - **Profile & Bookmarks**
            - **Settings**: font, background, reciter, tafsir source, cache clear
            - **Material 3 + dark/light theme + Bangla/English UI**
          files: |
            app/build/outputs/apk/release/islamichub-release.apk
            app/build/outputs/apk/release/checksums.txt
          draft: false
          prerelease: false
