<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <!-- Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <!-- Soft Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Circle Background -->
  <circle cx="60" cy="60" r="54" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Starry Background Details -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="28" cy="35" r="1" />
    <circle cx="34" cy="22" r="1.5" />
    <circle cx="48" cy="26" r="1" />
    <circle cx="72" cy="24" r="1.2" />
    <circle cx="85" cy="32" r="1.5" />
    <circle cx="92" cy="45" r="1" />
  </g>
  
  <!-- Crescent Moon -->
  <path d="M 60 14 A 10 10 0 1 0 74 24 A 8 8 0 1 1 60 14 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Mosque Structure -->
  <g id="mosque-body" transform="translate(0, 5)">
    <!-- Minaret Left -->
    <path d="M 28 85 L 32 85 L 32 45 C 32 43 30 40 30 40 C 30 40 28 43 28 45 Z" fill="url(#goldGrad)" />
    <!-- Minaret Dome Left -->
    <path d="M 28 45 C 28 43 32 43 32 45 L 30 38 Z" fill="url(#goldGrad)" />
    <!-- Minaret Top Crescent Left -->
    <circle cx="30" cy="35" r="1" fill="#fff" />
    
    <!-- Minaret Right -->
    <path d="M 88 85 L 92 85 L 92 45 C 92 43 90 40 90 40 C 90 40 88 43 88 45 Z" fill="url(#goldGrad)" />
    <!-- Minaret Dome Right -->
    <path d="M 88 45 C 88 43 92 43 92 45 L 90 38 Z" fill="url(#goldGrad)" />
    <!-- Minaret Top Crescent Right -->
    <circle cx="90" cy="35" r="1" fill="#fff" />

    <!-- Side Domes/Arches -->
    <path d="M 34 85 L 42 85 L 42 62 C 42 58 38 55 38 55 C 38 55 34 58 34 62 Z" fill="#ffffff" opacity="0.15" />
    <path d="M 78 85 L 86 85 L 86 62 C 86 58 82 55 82 55 C 82 55 78 58 78 62 Z" fill="#ffffff" opacity="0.15" />

    <!-- Main Wall Base -->
    <path d="M 38 85 L 82 85 L 82 58 L 38 58 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Wall Trim Top -->
    <rect x="36" y="55" width="48" height="3" fill="#ffffff" opacity="0.8" rx="1" />
    
    <!-- Main Center Dome -->
    <path d="M 44 55 C 44 32 76 32 76 55 Z" fill="url(#goldGrad)" />
    <!-- Dome Spire and Star -->
    <line x1="60" y1="32" x2="60" y2="24" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="60" cy="22" r="1.5" fill="url(#goldGrad)" />
    
    <!-- Main Arch Doorway -->
    <path d="M 50 85 L 70 85 L 70 65 C 70 60 60 56 60 56 C 60 56 50 60 50 65 Z" fill="#043226" />
    <path d="M 52 85 L 68 85 L 68 67 C 68 63 60 60 60 60 C 60 60 52 63 52 67 Z" fill="#ffffff" opacity="0.1" />
  </g>
</svg>
